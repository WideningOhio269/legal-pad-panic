<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Legal Pad Panic</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Gochi+Hand&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#3d2c1f;overflow:hidden;user-select:none;-webkit-user-select:none}
canvas{display:block;touch-action:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
/* =========================================================
   SETTINGS: tweak these after playtesting
   ========================================================= */
const CFG = {
  hearts: 4,
  inkMax: 100,
  lapPicks: 10,            // picks per lap
  restAfter: 5,            // rest stage after this pick
  restSeconds: 120,        // max rest length, there is a done button
  skipGrace: 2,            // skips a long game allows before the AI moves without you
  shortCopies: 4,          // copies of each short game per lap deck
  shortExtras: 2,          // random extra short games per lap deck
  shortTimeBase: 8, shortTimeMin: 5, shortTimeStepPerLap: 0.5,
  persistTime: 8, persistTimeMin: 6, extraTurnTime: 6,
  doubleShortChance: 0.2,
  goldChance: 0.12,
  shortBase: 100, shortTimeBonus: 50,
  persistMove: 25,
  win:  { ttt: 400, mancala: 1000 },
  draw: { ttt: 150, mancala: 300 },
  lossPoints: 300,
  ink: { loss: 40, fold: 10, timeout: 15, winRefill: 30, dry: 5 },  // dry = lost every pick you play a short game
  streakStep: 0.1, streakCap: 20,   // streak multiplier 1 + 0.1 per clear, max 3x
  lapStep: 0.25,                    // lap multiplier 1 + 0.25 per lap
  // per lap: grid size and k = how close to a wall the dot can get (bigger k = fatter dot, tighter corridors)
  mazeLaps: [ {c:9,r:5,k:0.2}, {c:8,r:5,k:0.25}, {c:7,r:4,k:0.29}, {c:6,r:4,k:0.33}, {c:5,r:3,k:0.36} ],
  mazeMaxCell: 64,
  mazeHits: 2,                      // wall hits allowed before you fail
  mazeGrace: 0.7,                   // seconds of no-hit after bumping a wall
  mazeSpeed: 6.5,                   // cells per second
  plinkoRows: [7,8,9,10],
  plinkoStarSlots: [3,2,1,1],
  plinkoPoints: [150,250,400],      // points per lap (lap 3+ uses the last one)
  plinkoSwing: [1.0,1.25,1.5,1.8],
  aiMistake: { cautious: 0.14, normal: 0.22, aggressive: 0.3 },
  mancalaStones: 3, mancalaDepth: 5,
  boilFps: 7,                       // how often the ink lines "boil"
  jitter: 1                         // overall hand-drawn wobble
};

/* ========================================================= */
const W = 1000, H = 700;
const cv = document.getElementById('c');
let ctx = cv.getContext('2d');
const MAIN = ctx;
let DPR = 1, SC = 1, OX = 0, OY = 0;
let deskCv = null, paperCv = null;

const INK = '#1d2742', RED = '#c23b33', GRAPHITE = '#4a4a4e', GOLD = '#e7b43b';
const R = Math.random;
const rr = (a,b) => a + R()*(b-a);
const ri = (a,b) => Math.floor(rr(a,b+1));
const pick = a => a[Math.floor(R()*a.length)];
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const lerp = (a,b,t) => a + (b-a)*t;
const ease = t => 1 - Math.pow(1-clamp(t,0,1), 3);
const easeBack = t => { t = clamp(t,0,1); const c = 1.6; return 1 + (c+1)*Math.pow(t-1,3) + c*Math.pow(t-1,2); };
const dist = (a,b) => Math.hypot(b[0]-a[0], b[1]-a[1]);
const lerpPt = (a,b,t) => [lerp(a[0],b[0],t), lerp(a[1],b[1],t)];
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(R()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function strSeed(s){ let h=2166136261; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); } return h>>>0; }
let seedCounter = Math.floor(R()*1e6);
const newSeed = () => (seedCounter = (seedCounter*16807 + 7919) % 2147483647);
function shade(hex,f){ const n=parseInt(hex.slice(1),16); const c=[n>>16,(n>>8)&255,n&255].map(v=>Math.round(f<0? v*(1+f) : v+(255-v)*f)); return `rgb(${c[0]},${c[1]},${c[2]})`; }

let T = 0, BOIL = 0, STATIC = false;

/* ---------- hand drawn primitives ---------- */
function spline(pts, seg=8, closed=false){
  const out=[], n=pts.length;
  const P = i => closed ? pts[(i+n)%n] : pts[clamp(i,0,n-1)];
  const last = closed ? n : n-1;
  for(let i=0;i<last;i++){
    const p0=P(i-1), p1=P(i), p2=P(i+1), p3=P(i+2);
    for(let s=0;s<seg;s++){
      const t=s/seg, t2=t*t, t3=t2*t;
      const f = k => 0.5*((2*p1[k]) + (-p0[k]+p2[k])*t + (2*p0[k]-5*p1[k]+4*p2[k]-p3[k])*t2 + (-p0[k]+3*p1[k]-3*p2[k]+p3[k])*t3);
      out.push([f(0), f(1)]);
    }
  }
  out.push(closed ? pts[0] : pts[n-1]);
  return out;
}

function inkPath(pts, o={}){
  const w = o.w ?? 2.2, c = o.c ?? INK, seed = o.seed ?? 1, j = (o.j ?? 1)*CFG.jitter;
  const prog = o.p ?? 1, alpha = o.a ?? 0.94;
  let P = o.smooth ? spline(pts, 6, o.closed) : (o.closed ? pts.concat([pts[0]]) : pts);
  if(P.length < 2) return;
  const rb = mulberry32(seed*13 + (STATIC||o.still ? 0 : BOIL)*977 + 1);
  const rs = mulberry32(seed*7 + 3);
  const ph1=rs()*6.28, ph2=rs()*6.28, f1=0.018+rs()*0.02, f2=0.06+rs()*0.05, ph3=rs()*6.28;
  const dense=[]; let dd=0;
  for(let i=0;i<P.length-1;i++){
    const x1=P[i][0], y1=P[i][1], x2=P[i+1][0], y2=P[i+1][1];
    const dx=x2-x1, dy=y2-y1, L=Math.hypot(dx,dy)||0.001, nx=-dy/L, ny=dx/L;
    const steps = Math.max(1, Math.ceil(L/8));
    for(let s=(i===0?0:1); s<=steps; s++){
      const t=s/steps, d=dd+L*t;
      const off = (Math.sin(d*f1+ph1)*0.9 + Math.sin(d*f2+ph2)*0.35)*j + (rb()-0.5)*j*0.6;
      dense.push([x1+dx*t+nx*off, y1+dy*t+ny*off, d]);
    }
    dd += L;
  }
  const total = dd, lim = total*prog;
  ctx.save();
  ctx.globalAlpha *= alpha;
  ctx.strokeStyle = c; ctx.lineCap='round'; ctx.lineJoin='round';
  if(o.fill){
    ctx.fillStyle = o.fill;
    ctx.beginPath(); ctx.moveTo(dense[0][0],dense[0][1]);
    for(const p of dense) ctx.lineTo(p[0],p[1]);
    ctx.closePath(); ctx.fill();
  }
  for(let i=0;i<dense.length-1;i++){
    const a=dense[i], b=dense[i+1];
    if(a[2] > lim) break;
    const d=a[2];
    let tap = 1;
    if(o.taper !== false && !o.closed) tap = Math.min(1, 0.4 + Math.min(d, total-d)/16);
    ctx.lineWidth = Math.max(0.4, w*tap*(0.82 + 0.32*Math.sin(d*0.045+ph3)));
    ctx.beginPath(); ctx.moveTo(a[0],a[1]); ctx.lineTo(b[0],b[1]); ctx.stroke();
  }
  ctx.restore();
}

function inkLine(x1,y1,x2,y2,o={}){
  const rs = mulberry32((o.seed??1)*3+11);
  const os = o.os ?? 3;
  const L = Math.hypot(x2-x1,y2-y1)||1, ux=(x2-x1)/L, uy=(y2-y1)/L;
  const e1 = os ? rs()*os : 0, e2 = os ? rs()*os : 0;
  inkPath([[x1-ux*e1, y1-uy*e1],[x2+ux*e2, y2+uy*e2]], o);
}

function inkRect(x,y,w,h,o={}){
  const s = o.seed ?? 1, rs = mulberry32(s*5+2);
  const c = [[x+rs()*3-1.5, y+rs()*3-1.5],[x+w+rs()*3-1.5, y+rs()*3-1.5],[x+w+rs()*3-1.5, y+h+rs()*3-1.5],[x+rs()*3-1.5, y+h+rs()*3-1.5]];
  if(o.fill){ ctx.save(); ctx.fillStyle=o.fill; ctx.beginPath(); ctx.moveTo(...c[0]); for(const p of c) ctx.lineTo(...p); ctx.closePath(); ctx.fill(); ctx.restore(); }
  for(let i=0;i<4;i++){ const a=c[i], b=c[(i+1)%4]; inkLine(a[0],a[1],b[0],b[1], Object.assign({}, o, {seed:s*4+i, fill:null})); }
}

function ellipsePts(cx,cy,rx,ry,seed,over=true){
  const rs = mulberry32(seed*9+4);
  const a0 = rs()*6.28, ov = over ? 0.25+rs()*0.35 : 0, ph = rs()*6.28;
  const n = Math.max(14, Math.round((rx+ry)/3));
  const pts=[];
  for(let i=0;i<=n;i++){
    const a = a0 + (Math.PI*2+ov)*i/n;
    const m = 1 + Math.sin(a*2+ph)*0.035 + (over ? (i/n)*0.04 : 0);
    pts.push([cx+Math.cos(a)*rx*m, cy+Math.sin(a)*ry*m]);
  }
  return pts;
}
function inkEllipse(cx,cy,rx,ry,o={}){
  const seed=o.seed??1;
  if(o.fill){ const fp=ellipsePts(cx,cy,rx,ry,seed,false); ctx.save(); ctx.fillStyle=o.fill; ctx.beginPath(); ctx.moveTo(...fp[0]); for(const p of fp) ctx.lineTo(...p); ctx.closePath(); ctx.fill(); ctx.restore(); }
  inkPath(ellipsePts(cx,cy,rx,ry,seed,true), Object.assign({}, o, {fill:null}));
}

function hatchFill(pts, color, gap=4, angle=-0.9, seed=1, w=1.6){
  ctx.save();
  ctx.beginPath(); ctx.moveTo(...pts[0]); for(const p of pts) ctx.lineTo(...p); ctx.closePath(); ctx.clip();
  let minx=1e9,miny=1e9,maxx=-1e9,maxy=-1e9;
  for(const p of pts){ minx=Math.min(minx,p[0]); miny=Math.min(miny,p[1]); maxx=Math.max(maxx,p[0]); maxy=Math.max(maxy,p[1]); }
  const cx=(minx+maxx)/2, cy=(miny+maxy)/2, rad=Math.hypot(maxx-minx,maxy-miny)/2+4;
  const ux=Math.cos(angle), uy=Math.sin(angle), nx=-uy, ny=ux;
  let k=0;
  for(let d=-rad; d<=rad; d+=gap){
    const px=cx+nx*d, py=cy+ny*d;
    inkPath([[px-ux*rad,py-uy*rad],[px+ux*rad,py+uy*rad]], {c:color, w, seed:seed+k++, j:0.6, taper:false, a:0.8});
  }
  ctx.restore();
}

function htext(str, x, y, o={}){
  const size=o.size||22, font=o.font||'Caveat', wt=o.wt||600, c=o.c||INK, al=o.align||'left';
  const seed=o.seed ?? strSeed(str), rot=o.rot||0, j=o.j??1;
  ctx.save(); ctx.translate(x,y); if(rot) ctx.rotate(rot);
  if(o.a!=null) ctx.globalAlpha*=o.a;
  ctx.font = `${wt} ${size}px "${font}", "Comic Sans MS", cursive`;
  ctx.fillStyle = c; ctx.textBaseline = o.base || 'alphabetic';
  const chars=[...String(str)], ws=[]; let tot=0;
  for(const ch of chars){ const w=ctx.measureText(ch).width; ws.push(w); tot+=w; }
  let cx = al==='center' ? -tot/2 : al==='right' ? -tot : 0;
  const rb = mulberry32(seed*31 + (STATIC||o.still ? 0 : BOIL)*131), rs = mulberry32(seed*17+5);
  for(let k=0;k<chars.length;k++){
    const w=ws[k], r1=rs(), r2=rb(), r3=rs();
    ctx.save();
    ctx.translate(cx+w/2, (r3-0.5)*size*0.07*j + (r2-0.5)*0.7*j);
    ctx.rotate(((r1-0.5)*0.09 + (r2-0.5)*0.02)*j);
    ctx.fillText(chars[k], -w/2, 0);
    ctx.restore();
    cx += w;
  }
  ctx.restore();
  return tot;
}

function heartPts(cx,cy,s){
  const pts=[];
  for(let i=0;i<=28;i++){ const t=Math.PI*2*i/28; const x=16*Math.pow(Math.sin(t),3); const y=-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t)); pts.push([cx+x*s/32, cy+y*s/32]); }
  return pts;
}
function starPts(cx,cy,r1,r2,rot=-Math.PI/2){
  const pts=[]; for(let i=0;i<10;i++){ const r=i%2?r2:r1, a=rot+i*Math.PI/5; pts.push([cx+Math.cos(a)*r, cy+Math.sin(a)*r]); } return pts;
}
function drawStar(cx,cy,r,seed=3,fill=GOLD){
  const p=starPts(cx,cy,r,r*0.45);
  ctx.save(); ctx.fillStyle=fill; ctx.globalAlpha*=0.9; ctx.beginPath(); ctx.moveTo(...p[0]); for(const q of p) ctx.lineTo(...q); ctx.closePath(); ctx.fill(); ctx.restore();
  inkPath(p, {closed:true, w:1.8, seed, c:'#5a3d06'});
}
function roundRectPts(x,y,w,h,r){
  const pts=[], seg=5;
  const corner=(cx,cy,a0)=>{ for(let i=0;i<=seg;i++){ const a=a0+(Math.PI/2)*i/seg; pts.push([cx+Math.cos(a)*r, cy+Math.sin(a)*r]); } };
  corner(x+w-r, y+r, -Math.PI/2); corner(x+w-r, y+h-r, 0); corner(x+r, y+h-r, Math.PI/2); corner(x+r, y+r, Math.PI);
  return pts;
}

/* ---------- desk + paper (pre-rendered) ---------- */
function buildDesk(){
  deskCv = document.createElement('canvas');
  deskCv.width = Math.max(1, innerWidth*DPR); deskCv.height = Math.max(1, innerHeight*DPR);
  const g = deskCv.getContext('2d');
  g.fillStyle = '#4a3423'; g.fillRect(0,0,deskCv.width,deskCv.height);
  const r = mulberry32(99);
  for(let i=0;i<140;i++){
    const y = r()*deskCv.height; g.strokeStyle = r()<0.5 ? 'rgba(0,0,0,0.08)' : 'rgba(255,220,170,0.04)';
    g.lineWidth = 1 + r()*3*DPR; g.beginPath(); g.moveTo(0,y);
    for(let x=0;x<=deskCv.width;x+=40*DPR) g.lineTo(x, y + Math.sin(x*0.004 + i)*6*DPR + Math.sin(x*0.013+i*2)*2*DPR);
    g.stroke();
  }
  const gr = g.createRadialGradient(deskCv.width/2, deskCv.height/2, 100, deskCv.width/2, deskCv.height/2, Math.max(deskCv.width,deskCv.height)*0.7);
  gr.addColorStop(0,'rgba(255,230,180,0.06)'); gr.addColorStop(1,'rgba(0,0,0,0.35)');
  g.fillStyle = gr; g.fillRect(0,0,deskCv.width,deskCv.height);
}

function buildPaper(){
  const S = 2;
  paperCv = document.createElement('canvas'); paperCv.width = W*S; paperCv.height = H*S;
  const g = paperCv.getContext('2d'); g.scale(S,S);
  const saved = ctx; ctx = g; STATIC = true;
  const r = mulberry32(newSeed());

  const pad = [[32,24],[968,21],[971,684],[29,688]];
  const padPath = () => { g.beginPath(); g.moveTo(...pad[0]);
    for(let i=0;i<4;i++){ const a=pad[i], b=pad[(i+1)%4]; const mx=(a[0]+b[0])/2+(r()-0.5)*4, my=(a[1]+b[1])/2+(r()-0.5)*4; g.quadraticCurveTo(mx,my,b[0],b[1]); }
    g.closePath(); };
  // shadow
  g.save(); g.shadowColor='rgba(0,0,0,0.45)'; g.shadowBlur=26; g.shadowOffsetX=9; g.shadowOffsetY=12;
  g.fillStyle='#f6e991'; padPath(); g.fill(); g.restore();
  // lighter top, darker edges
  g.save(); padPath(); g.clip();
  let gr = g.createLinearGradient(0,0,0,H); gr.addColorStop(0,'#fbf1a6'); gr.addColorStop(1,'#f2e388');
  g.fillStyle=gr; g.fillRect(0,0,W,H);
  gr = g.createRadialGradient(W/2,H/2,200,W/2,H/2,620); gr.addColorStop(0,'rgba(0,0,0,0)'); gr.addColorStop(1,'rgba(90,60,0,0.10)');
  g.fillStyle=gr; g.fillRect(0,0,W,H);
  // grain
  const gc = document.createElement('canvas'); gc.width=160; gc.height=160;
  const gg = gc.getContext('2d'); const id = gg.createImageData(160,160);
  for(let i=0;i<id.data.length;i+=4){ const v = r()<0.5 ? 0 : 255; id.data[i]=v; id.data[i+1]=v; id.data[i+2]=v*0.9; id.data[i+3]=r()*22; }
  gg.putImageData(id,0,0);
  g.fillStyle = g.createPattern(gc,'repeat'); g.fillRect(0,0,W,H);
  // fibers
  for(let i=0;i<500;i++){ g.strokeStyle = r()<0.5?'rgba(120,90,20,0.06)':'rgba(255,255,255,0.12)'; g.lineWidth=0.6; const x=r()*W, y=r()*H, a=r()*6.28, l=2+r()*6; g.beginPath(); g.moveTo(x,y); g.quadraticCurveTo(x+Math.cos(a+1)*l*0.5, y+Math.sin(a+1)*l*0.5, x+Math.cos(a)*l, y+Math.sin(a)*l); g.stroke(); }
  // rule lines, fading in and out, not perfectly parallel
  for(let y=134, k=0; y<680; y+=28, k++){
    const slope=(r()-0.5)*3; let x=30;
    while(x<970){
      const seg = 60+r()*140; const x2=Math.min(970,x+seg);
      g.strokeStyle = `rgba(105,148,206,${0.32+r()*0.28})`; g.lineWidth = 0.9+r()*0.4;
      g.beginPath(); g.moveTo(x, y + slope*(x-30)/940 + (r()-0.5)*0.6); g.lineTo(x2, y + slope*(x2-30)/940 + (r()-0.5)*0.6); g.stroke();
      x = x2;
    }
  }
  // margin
  inkPath([[121,60],[120,300],[122,520],[121,688]], {c:'#d0504a', w:1.5, seed:41, j:0.5, taper:false, a:0.8, smooth:true});
  inkPath([[126,60],[125,300],[126,520],[126,688]], {c:'#d0504a', w:0.8, seed:42, j:0.5, taper:false, a:0.7, smooth:true});
  // ghost writing from an earlier page
  g.strokeStyle='rgba(60,50,20,0.06)'; g.lineWidth=1.2;
  for(let i=0;i<5;i++){
    const y0 = 134 + 28*ri(4,18) - 6; let x0 = 150 + r()*500; const len = 120+r()*260;
    g.beginPath(); g.moveTo(x0,y0);
    for(let x=0;x<len;x+=2){ const yy = y0 + Math.sin(x*0.35)*4*Math.sin(x*0.05+i) - Math.abs(Math.sin(x*0.11))*4; g.lineTo(x0+x+Math.sin(x*0.35)*2, yy); }
    g.stroke();
  }
  // smudges
  for(let i=0;i<4;i++){
    const x=150+r()*700, y=150+r()*480, rx=30+r()*60;
    const sg=g.createRadialGradient(x,y,2,x,y,rx); sg.addColorStop(0,'rgba(70,70,70,0.08)'); sg.addColorStop(1,'rgba(70,70,70,0)');
    g.save(); g.translate(x,y); g.scale(1, 0.35+r()*0.4); g.rotate(r()*3); g.translate(-x,-y); g.fillStyle=sg; g.beginPath(); g.arc(x,y,rx,0,7); g.fill(); g.restore();
  }
  // coffee ring
  { const spots=[[880,300],[190,600],[840,520],[230,180]]; const [x,y]=pick(spots); const rad=42+r()*10;
    g.save(); g.strokeStyle='rgba(130,80,30,0.13)'; g.lineWidth=7; g.beginPath();
    const a0=r()*6.28; for(let i=0;i<=60;i++){ const a=a0+i/60*(Math.PI*2-0.5); const m=1+Math.sin(a*3)*0.02; g.lineTo(x+Math.cos(a)*rad*m, y+Math.sin(a)*rad*0.92*m); } g.stroke();
    g.strokeStyle='rgba(100,55,15,0.18)'; g.lineWidth=1.3; g.beginPath();
    for(let i=0;i<=60;i++){ const a=a0+0.2+i/60*(Math.PI*2-0.9); g.lineTo(x+Math.cos(a)*(rad+3), y+Math.sin(a)*(rad+3)*0.92); } g.stroke();
    g.fillStyle='rgba(130,80,30,0.12)'; g.beginPath(); g.ellipse(x+rad*1.3, y-rad*0.6, 5, 4, 0, 0, 7); g.fill();
    g.beginPath(); g.ellipse(x+rad*1.45, y-rad*0.5, 2.5, 2, 0, 0, 7); g.fill(); g.restore(); }
  g.restore();

  // binding
  g.save();
  g.beginPath(); g.moveTo(28,16); g.lineTo(972,13); g.lineTo(972,58); g.lineTo(28,61); g.closePath();
  g.shadowColor='rgba(0,0,0,0.35)'; g.shadowBlur=8; g.shadowOffsetY=3; g.fillStyle='#6b2a1c'; g.fill(); g.restore();
  g.save(); g.beginPath(); g.moveTo(28,16); g.lineTo(972,13); g.lineTo(972,58); g.lineTo(28,61); g.closePath(); g.clip();
  for(let i=0;i<900;i++){ g.fillStyle = r()<0.5?'rgba(0,0,0,0.12)':'rgba(255,200,170,0.06)'; g.fillRect(28+r()*944, 13+r()*48, 1+r()*2, 1); }
  gr = g.createLinearGradient(0,13,0,61); gr.addColorStop(0,'rgba(255,220,200,0.12)'); gr.addColorStop(0.75,'rgba(0,0,0,0)'); gr.addColorStop(1,'rgba(0,0,0,0.35)');
  g.fillStyle=gr; g.fillRect(28,13,944,48); g.restore();

  // torn page stubs (back to front)
  const layers = [{c:'#efe08a',d:15},{c:'#f6ea9a',d:11},{c:'#fbf2b2',d:7}];

    g.fillStyle=L.c; g.beginPath(); g.moveTo(30,55); for(const p of pts) g.lineTo(p[0],p[1]); g.lineTo(970,55); g.closePath(); g.fill(); g.restore();
    g.strokeStyle='rgba(255,255,255,0.5)'; g.lineWidth=0.6;
    for(let i=1;i<pts.length-1;i+=2){ if(r()<0.6){ const p=pts[i]; g.beginPath(); g.moveTo(p[0],p[1]); g.lineTo(p[0]+(r()-0.5)*4, p[1]+1+r()*3); g.stroke(); } }
  }
  // dog-eared pad corner
  { const C=[971,684], A=[971,640+r()*10], B=[922+r()*10,686];
    const mx=(A[0]+B[0])/2, my=(A[1]+B[1])/2; const tip=[mx+(mx-C[0])*0.85, my+(my-C[1])*0.85];
    g.save(); g.globalCompositeOperation='destination-out'; g.beginPath(); g.moveTo(...A); g.lineTo(...C); g.lineTo(...B); g.closePath(); g.fill(); g.restore();
    g.save(); g.shadowColor='rgba(0,0,0,0.3)'; g.shadowBlur=8; g.shadowOffsetX=-3; g.shadowOffsetY=-3;
    const fg=g.createLinearGradient(mx,my,tip[0],tip[1]); fg.addColorStop(0,'#d9cb76'); fg.addColorStop(1,'#fbf3c0');
    g.fillStyle=fg; g.beginPath(); g.moveTo(...A); g.quadraticCurveTo(tip[0]+6, tip[1]-14, tip[0], tip[1]); g.quadraticCurveTo(tip[0]-12, tip[1]+6, B[0], B[1]); g.closePath(); g.fill(); g.restore(); }

  STATIC = false; ctx = saved;
}

/* ---------- sticky notes ---------- */
function makeNoteCanvas(color, w, h, seed){
  const pad = 36, S = 2;
  const c = document.createElement('canvas'); c.width=(w+pad*2)*S; c.height=(h+pad*2)*S;
  const g = c.getContext('2d'); g.scale(S,S); g.translate(pad,pad);
  const r = mulberry32(seed);
  const P = [[r()*3-1.5, r()*3-1.5],[w+r()*3-1.5, r()*3-1.5],[w+r()*3-1.5, h+r()*3-1.5],[r()*3-1.5, h+r()*3-1.5]];
  const roll = r(); let curl='flat', ci=-1, cs=0;
  const sz = Math.min(w,h);
  if(roll < 0.3) curl='flat';
  else if(roll < 0.6){ curl='corner'; ci = r()<0.8 ? (r()<0.5?2:3) : 1; cs = sz*(0.09+r()*0.09); }
  else if(roll < 0.8) curl='lift';
  else if(roll < 0.92){ curl='dogear'; ci = r()<0.5?1:0; cs = sz*(0.05+r()*0.035); }
  else curl='crease';

  const pts=[];
  for(let i=0;i<4;i++){
    const a=P[i], b=P[(i+1)%4];
    let s=a, e=b;
    if(ci===i) s = lerpPt(a,b, cs/dist(a,b));
    if(ci===(i+1)%4) e = lerpPt(b,a, cs/dist(a,b));
    const bw=(r()-0.5)*3.4, n=7;
    const dx=e[0]-s[0], dy=e[1]-s[1], L=Math.hypot(dx,dy), nx=-dy/L, ny=dx/L;
    for(let k=0;k<n;k++){ const t=k/n; const off=Math.sin(t*Math.PI)*bw + (k ? (r()-0.5)*0.7 : 0); pts.push([lerp(s[0],e[0],t)+nx*off, lerp(s[1],e[1],t)+ny*off]); }
    if(ci===(i+1)%4) pts.push(e);
  }
  const path = () => { g.beginPath(); g.moveTo(pts[0][0],pts[0][1]); for(const p of pts) g.lineTo(p[0],p[1]); g.closePath(); };

  if(curl==='lift'){
    g.save(); g.shadowColor='rgba(30,20,0,0.4)'; g.shadowBlur=16; g.shadowOffsetX=6; g.shadowOffsetY=12;
    g.fillStyle='rgba(0,0,0,0.3)'; g.beginPath(); g.ellipse(w/2+3, h-10, w*0.47, 10, 0, 0, Math.PI*2); g.fill(); g.restore();
  }
  g.save(); g.shadowColor='rgba(40,25,0,0.30)'; g.shadowBlur=9; g.shadowOffsetX=4; g.shadowOffsetY=6;
  g.fillStyle=color; path(); g.fill(); g.restore();

  g.save(); path(); g.clip();
  let gr = g.createLinearGradient(0,0,w*0.35,h);
  gr.addColorStop(0,'rgba(255,255,255,0.20)'); gr.addColorStop(0.55,'rgba(255,255,255,0)'); gr.addColorStop(1,'rgba(0,0,0,0.08)');
  g.fillStyle=gr; g.fillRect(-6,-6,w+12,h+12);
  const bh = h*(0.12+r()*0.06), tilt=(r()-0.5)*5;
  g.fillStyle=`rgba(0,0,0,${0.035+r()*0.035})`; g.beginPath(); g.moveTo(-6,-6); g.lineTo(w+6,-6); g.lineTo(w+6,bh+tilt); g.lineTo(-6,bh-tilt); g.fill();
  g.strokeStyle='rgba(0,0,0,0.05)'; g.lineWidth=1; g.beginPath(); g.moveTo(-6,bh-tilt); g.lineTo(w+6,bh+tilt); g.stroke();
  if(curl==='lift'){ gr=g.createLinearGradient(0,h-28,0,h); gr.addColorStop(0,'rgba(255,255,255,0)'); gr.addColorStop(0.7,'rgba(255,255,255,0.25)'); gr.addColorStop(1,'rgba(0,0,0,0.14)'); g.fillStyle=gr; g.fillRect(-6,h-28,w+12,34); }
  for(let i=0;i<w*h/140;i++){ g.fillStyle = r()<0.5?'rgba(0,0,0,0.05)':'rgba(255,255,255,0.12)'; g.fillRect(r()*w, r()*h, 0.8+r()*1.4, 0.8+r()*1.4); }
  if(curl==='crease'){
    const y0=h*(0.3+r()*0.45), y1=y0+(r()-0.5)*h*0.5;
    g.strokeStyle='rgba(255,255,255,0.45)'; g.lineWidth=1.3; g.beginPath(); g.moveTo(-6,y0); g.lineTo(w+6,y1); g.stroke();
    g.strokeStyle='rgba(0,0,0,0.09)'; g.lineWidth=1; g.beginPath(); g.moveTo(-6,y0+1.6); g.lineTo(w+6,y1+1.6); g.stroke();
  }
  g.restore();

  if(ci>=0){
    const C=P[ci], prev=P[(ci+3)%4], next=P[(ci+1)%4];
    const A=lerpPt(C,prev,cs/dist(C,prev)), B=lerpPt(C,next,cs/dist(C,next));
    const mx=(A[0]+B[0])/2, my=(A[1]+B[1])/2;
    const k = curl==='corner' ? 0.7+r()*0.25 : 0.95;
    const tip=[mx+(mx-C[0])*k, my+(my-C[1])*k];
    const bulge = curl==='corner' ? 0.28 : 0.08;
    const c1=[lerp(A[0],tip[0],0.5)+(C[0]-mx)*bulge, lerp(A[1],tip[1],0.5)+(C[1]-my)*bulge];
    const c2=[lerp(B[0],tip[0],0.5)+(C[0]-mx)*bulge, lerp(B[1],tip[1],0.5)+(C[1]-my)*bulge];
    g.save(); g.shadowColor='rgba(30,20,0,0.32)'; g.shadowBlur=7; g.shadowOffsetX=(mx-C[0])*0.12; g.shadowOffsetY=(my-C[1])*0.12+2;
    const fg=g.createLinearGradient(mx,my,tip[0],tip[1]); fg.addColorStop(0,shade(color,-0.12)); fg.addColorStop(0.5,shade(color,0.12)); fg.addColorStop(1,shade(color,0.35));
    g.fillStyle=fg; g.beginPath(); g.moveTo(A[0],A[1]); g.quadraticCurveTo(c1[0],c1[1],tip[0],tip[1]); g.quadraticCurveTo(c2[0],c2[1],B[0],B[1]); g.closePath(); g.fill(); g.restore();
    g.strokeStyle='rgba(0,0,0,0.12)'; g.lineWidth=0.8; g.beginPath(); g.moveTo(A[0],A[1]); g.lineTo(B[0],B[1]); g.stroke();
  }
  return { cv:c, pad };
}

/* ---------- SHORT GAME: maze ---------- */
class Maze {
  constructor(level){
    const ML = CFG.mazeLaps[Math.min(level-1, CFG.mazeLaps.length-1)];
    const c=ML.c, r=ML.r; this.c=c; this.r=r; this.k=ML.k;
    this.cs = Math.floor(Math.min(620/c, 360/r, CFG.mazeMaxCell));
    this.hits=0; this.grace=0; this.hitMarks=[];
    this.ox = 500 - c*this.cs/2; this.oy = 395 - r*this.cs/2;
    this.cells = []; for(let i=0;i<c*r;i++) this.cells.push({n:1,e:1,s:1,w:1});
    const vis = new Array(c*r).fill(false), st=[[ri(0,c-1), ri(0,r-1)]]; vis[st[0][1]*c+st[0][0]] = true;
    while(st.length){
      const [x,y] = st[st.length-1];
      const nb = [[0,-1,'n','s'],[1,0,'e','w'],[0,1,'s','n'],[-1,0,'w','e']].filter(([dx,dy])=>{ const nx=x+dx, ny=y+dy; return nx>=0&&ny>=0&&nx<c&&ny<r&&!vis[ny*c+nx]; });
      if(!nb.length){ st.pop(); continue; }
      const [dx,dy,a,b] = pick(nb); const nx=x+dx, ny=y+dy;
      this.cell(x,y)[a]=0; this.cell(nx,ny)[b]=0; vis[ny*c+nx]=true; st.push([nx,ny]);
    }
    this.start=[0, ri(0,r-1)]; this.exit=[c-1, ri(0,r-1)];
    this.px=this.start[0]+0.5; this.py=this.start[1]+0.5;
    this.drag=false; this.mx=0; this.my=0; this.moved=false;
    this.done=false; this.outcome=null; this.seed=newSeed();
    this.trail=[[this.px,this.py]];
    // merged wall strokes
    this.walls=[]; const cs=this.cs, ox=this.ox, oy=this.oy; let k=0;
    for(let y=0;y<=r;y++){ let run=-1;
      for(let x=0;x<=c;x++){ const has = x<c && (y<r ? this.cell(x,y).n : this.cell(x,r-1).s);
        if(has && run<0) run=x; if(!has && run>=0){ this.walls.push([ox+run*cs, oy+y*cs, ox+x*cs, oy+y*cs, this.seed+k++]); run=-1; } } }
    for(let x=0;x<=c;x++){ let run=-1;
      for(let y=0;y<=r;y++){ const has = y<r && (x<c ? this.cell(x,y).w : this.cell(c-1,y).e);
        if(has && run<0) run=y; if(!has && run>=0){ this.walls.push([ox+x*cs, oy+run*cs, ox+x*cs, oy+y*cs, this.seed+k++]); run=-1; } } }
  }
  cell(x,y){ return this.cells[y*this.c+x]; }
  valid(px,py){
    if(px<0||py<0||px>=this.c||py>=this.r) return false;
    const cx=Math.floor(px), cy=Math.floor(py), lx=px-cx, ly=py-cy, k=this.k, C=this.cell(cx,cy);
    const L=lx<k, Rt=lx>1-k, Tp=ly<k, B=ly>1-k;
    if((L||Rt)&&(Tp||B)) return false;
    if(L&&C.w) return false; if(Rt&&C.e) return false; if(Tp&&C.n) return false; if(B&&C.s) return false;
    return true;
  }
  freeze(){ return this.done; }
  hit(hx,hy){
    this.hits++; this.hitMarks.push([hx,hy,newSeed()]); this.grace=CFG.mazeGrace;
    const idx=Math.max(0, this.trail.length-4); this.px=this.trail[idx][0]; this.py=this.trail[idx][1]; this.trail.length=idx+1;
    if(G) G.shake=0.15;
    if(this.hits>=CFG.mazeHits){ this.done=true; this.outcome='fail'; }
  }
  update(dt){
    if(this.grace>0) this.grace-=dt;
    if(this.done || !this.drag) return;
    if(this.grace>CFG.mazeGrace-0.35) return;   // brief freeze right after a bump
    const tx=(this.mx-this.ox)/this.cs, ty=(this.my-this.oy)/this.cs;
    let dx=tx-this.px, dy=ty-this.py; const d=Math.hypot(dx,dy); if(d<0.02) return;
    let move=Math.min(d, CFG.mazeSpeed*dt); const steps=Math.ceil(move/0.03); const st=move/steps;
    for(let i=0;i<steps;i++){
      dx=tx-this.px; dy=ty-this.py; const dd=Math.hypot(dx,dy)||1;
      const nx=this.px+dx/dd*st, ny=this.py+dy/dd*st;
      if(this.valid(nx,ny)){ this.px=nx; this.py=ny; }
      else { if(this.grace<=0) this.hit(nx,ny); break; }
    }
    if(this.done) return;
    this.moved=true;
    const lt=this.trail[this.trail.length-1]; if(Math.hypot(lt[0]-this.px, lt[1]-this.py)>0.12) this.trail.push([this.px,this.py]);
    if(Math.floor(this.px)===this.exit[0] && Math.floor(this.py)===this.exit[1]){ this.done=true; this.outcome='win'; }
  }
  onDown(x,y){ this.drag=true; this.mx=x; this.my=y; }
  onMove(x,y){ this.mx=x; this.my=y; }
  onUp(){ this.drag=false; }
  cursor(){ return this.drag ? 'grabbing' : 'grab'; }
  draw(){
    const cs=this.cs, ox=this.ox, oy=this.oy;
    if(this.trail.length>1) inkPath(this.trail.map(p=>[ox+p[0]*cs, oy+p[1]*cs]), {c:GRAPHITE, w:1.4, seed:this.seed+900, j:0.4, a:0.45, still:true});
    for(const wl of this.walls) inkLine(wl[0],wl[1],wl[2],wl[3], {w:2.8, seed:wl[4], os:3});
    htext('start', ox-8, oy+(this.start[1]+0.5)*cs+6, {size:20, c:GRAPHITE, align:'right', seed:this.seed+3});
    drawStar(ox+(this.exit[0]+0.5)*cs, oy+(this.exit[1]+0.5)*cs, cs*0.26, this.seed+4);
    for(const h of this.hitMarks){ const x=ox+h[0]*cs, y=oy+h[1]*cs; inkLine(x-9,y-9,x+9,y+9,{c:RED,w:3,seed:h[2],os:2}); inkLine(x+9,y-9,x-9,y+9,{c:RED,w:3,seed:h[2]+1,os:2}); }
    const dx=ox+this.px*cs, dy=oy+this.py*cs, rad=cs*this.k*0.92;
    const blink = this.grace>0 && Math.floor(T*12)%2===0;
    if(!blink) inkEllipse(dx,dy,rad,rad,{fill:'#2b3a8c', c:INK, w:2, seed:this.seed+5});
    if(!this.moved){ htext('hold and drag, do not touch the walls', dx+rad+8, dy-rad-6, {size:20, c:RED, seed:this.seed+6, rot:-0.04}); }
    const left=CFG.mazeHits-this.hits;
    htext(left===1 ? 'one more bump and you are out' : `wall bumps left: ${left}`, 500, oy-14, {size:21, c:left===1?RED:GRAPHITE, align:'center', seed:this.seed+7+this.hits});
  }
}

/* ---------- SHORT GAME: plinko ---------- */
class Plinko {
  constructor(level){
    const li=Math.min(level-1,3);
    this.left=290; this.right=710; this.slots=7; this.sx=(this.right-this.left)/this.slots;
    this.top=232; this.slotTop=525; this.bottom=585;
    const rows=CFG.plinkoRows[li], gap=(this.slotTop-36-this.top)/(rows-1);
    this.pegs=[];
    for(let i=0;i<rows;i++){
      const y=this.top+i*gap;
      if(i%2===0){ for(let k=1;k<this.slots;k++) this.pegs.push([this.left+this.sx*k+rr(-2,2), y+rr(-2,2), rr(3.3,4.4)]); }
      else { for(let k=0;k<this.slots;k++) this.pegs.push([this.left+this.sx*(k+0.5)+rr(-2,2), y+rr(-2,2), rr(3.3,4.4)]); }
    }
    const n=CFG.plinkoStarSlots[li], s0=ri(0,this.slots-n); this.star=new Set(); for(let i=0;i<n;i++) this.star.add(s0+i);
    this.chip={x:500,y:186,vx:0,vy:0,r:11}; this.state='aim'; this.t=0; this.swing=CFG.plinkoSwing[li]; this.ph=rr(0,6);
    this.slot=null; this.wait=0; this.done=false; this.outcome=null; this.seed=newSeed();
  }
  freeze(){ return this.state!=='aim'; }
  drop(){ if(this.state!=='aim') return; this.state='fall'; this.chip.vx=rr(-20,20); this.chip.vy=0; }
  onDown(){ this.drop(); }
  onMove(){} onUp(){}
  onTimeout(){ this.drop(); return true; }
  cursor(){ return this.state==='aim'?'pointer':'default'; }
  update(dt){
    const ch=this.chip;
    if(this.state==='aim'){ this.t+=dt; ch.x = 500 + Math.sin(this.t*this.swing*2+this.ph)*190; return; }
    if(this.state==='landed'){ this.wait-=dt; if(this.wait<=0 && !this.done){ this.done=true; this.outcome=this.star.has(this.slot)?'win':'fail'; } return; }

/* ---------- game state ---------- */
let G = null, MODE = 'title', MT = 0;
let HI = 0; try { HI = parseInt(localStorage.getItem('lpp_hi')||'0',10) || 0; } catch(e){}
const mouse = { x:0, y:0, down:false };
let titleBtn = null, againBtn = null;

function newRun(){
  G = { score:0, hearts:CFG.hearts, ink:CFG.inkMax, streak:0, bestStreak:0, lap:1, pick:0,
        shortDeck:[], offers:[], discard:null, stack:[], stackOut:[], fly:null, cur:null, timer:null,
        persist:{ ttt:new TTT(), mancala:new Mancala() },
        stats:{ won:0, lost:0, drawn:0, shortWon:0, shortFailed:0 }, drawings:[], popups:[], shake:0, result:null, rest:null, book:-592, newBest:false, goFlip:0 };
  buildShortDeck(); makeOffers(); setMode('pick');
}
function setMode(m){ MODE=m; MT=0; }
function buildShortDeck(){ const d=[]; for(const id of SHORTS) for(let k=0;k<CFG.shortCopies;k++) d.push(id); for(let k=0;k<CFG.shortExtras;k++) d.push(pick(SHORTS)); G.shortDeck=shuffle(d); }
function drawShort(){ return G.shortDeck.length ? G.shortDeck.pop() : pick(SHORTS); }
function makeOffers(){
  const a=drawShort(); const b = R()<CFG.doubleShortChance ? drawShort() : pick(PERSISTS);
  G.offers = shuffle([a,b]).map((id,k)=>{ const n=makeNote(id); n.gold = R()<CFG.goldChance; n.x = k===0?330:670; n.y=372; n.rot=(R()-0.5)*0.17; n.enter=-k*0.08; return n; });
  G.pick++;
}
function mults(){ return { lapM: 1+(G.lap-1)*CFG.lapStep, strM: 1+Math.min(G.streak,CFG.streakCap)*CFG.streakStep }; }
function popup(text,x,y,c=INK,size=30){ G.popups.push({text,x,y,c,size,t:0,seed:newSeed()}); }
function drainInk(a){ G.ink-=a; if(G.ink<=0){ G.hearts--; G.ink=CFG.inkMax; G.shake=0.4; popup('out of ink! -1 heart', 380, 150, RED, 28); } }

function applyPersist(id, outcome, gold, moves, timeouts){
  const {lapM,strM}=mults(); let pts=Math.round(CFG.persistMove*moves*lapM*gold), stamp='', col=RED, sub='';
  for(let i=0;i<timeouts;i++) drainInk(CFG.ink.timeout);
  if(outcome==='win'){ pts += Math.round(CFG.win[id]*strM*lapM*gold); G.streak++; G.ink=Math.min(CFG.inkMax, G.ink+CFG.ink.winRefill); G.stats.won++; stamp='WON!'; sub='fresh ink cartridge +'+CFG.ink.winRefill; }
  else if(outcome==='lose'){ pts -= CFG.lossPoints; G.streak=0; drainInk(CFG.ink.loss); G.stats.lost++; stamp='LOST'; sub='streak reset · ink spilled'; }
  else if(outcome==='draw'){ pts += Math.round(CFG.draw[id]*lapM*gold); G.stats.drawn++; stamp='DRAW'; }
  else { if(timeouts){ stamp='TOO SLOW'; sub='random move · -ink'; } else { stamp='MOVED'; col='#2b4a8c'; } }
  return {pts, stamp, col, sub};
}
function choose(n){
  const other = G.offers.find(o=>o!==n); G.discard = other ? {n:other, t:0} : null;
  if(n.kind==='persist') G.persist[n.id].skips=0;
  if(other && other.kind==='persist'){
    const g=G.persist[other.id]; g.skips=(g.skips||0)+1;
    if(g.skips>CFG.skipGrace){
      const out=g.aiSkipTurn();
      if(out){
        const r=applyPersist(other.id, out, 1, 0, 0);
        G.score=Math.max(0,G.score+r.pts); G.bestStreak=Math.max(G.bestStreak,G.streak);
        const msg = out==='lose' ? 'they won while you were away' : out==='win' ? 'you won while away?!' : 'it ended in a draw';
        popup(`${other.gm.name}: ${msg} ${r.pts>0?'+':''}${r.pts}`, 500, 200, out==='win'?'#2b6b2b':RED, 26);
        g.reset(); g.skips=0;
      } else popup(`${other.gm.name}: they moved without you`, 500, 200, RED, 24);
    }
  }
  G.offers=[]; G.fly={ n, x0:n.x, y0:n.y-n.hover*7, r0:n.rot, s0:1+n.hover*0.03, x1:868+rr(-12,12), y1:596+rr(-8,8), r1:(R()-0.5)*0.45, t:0 };
  setMode('fly');
}
function startGame(n){
  if(n.kind==='short'){ const g = n.id==='maze' ? new Maze(G.lap) : new Plinko(G.lap); G.cur={n,kind:'short',g}; G.timer={dur:Math.max(CFG.shortTimeMin, CFG.shortTimeBase-(G.lap-1)*CFG.shortTimeStepPerLap), el:0}; }
  else { const g=G.persist[n.id]; g.begin(); G.cur={n,kind:'persist',g}; G.timer={dur:Math.max(CFG.persistTimeMin, CFG.persistTime-(G.lap-1)*0.3), el:0}; }
  setMode('prompt');
}
function finishGame(){
  const {n,kind,g}=G.cur, gold=n.gold?2:1, {lapM,strM}=mults();
  let pts=0, stamp='', col=RED, sub='';
  if(kind==='short'){
    if(g.outcome==='win'){
      if(n.id==='plinko') pts=Math.round(CFG.plinkoPoints[Math.min(G.lap-1,CFG.plinkoPoints.length-1)]*strM*lapM*gold);
      else { const frac=1-G.timer.el/G.timer.dur; pts=Math.round((CFG.shortBase+CFG.shortTimeBonus*frac)*strM*lapM*gold); }
      G.streak++; stamp=pick(['NICE','GOOD','YES!']); G.stats.shortWon++;
    }
    else { G.hearts--; G.streak=0; stamp='NOPE'; sub = (n.id==='maze' && g.hits>=CFG.mazeHits) ? 'two wall bumps · -1 heart' : '-1 heart'; G.shake=0.4; G.stats.shortFailed++; }
    drainInk(CFG.ink.dry); popup(`-${CFG.ink.dry} ink`, 400, 150, '#2b3a8c', 20);
  } else {
    const r=applyPersist(n.id, g.outcome, gold, g.playerMoves, g.timeouts);
    pts=r.pts; stamp=r.stamp; col=r.col; sub=r.sub;
    if(g.outcome!=='move') g.needsReset=true;
  }
  G.score=Math.max(0, G.score+pts); G.bestStreak=Math.max(G.bestStreak,G.streak);
  G.result={stamp,pts,col,sub};
  if(pts) popup((pts>0?'+':'')+pts.toLocaleString(), 870, 168, pts>0?'#2b6b2b':RED, 32);
  setMode('result');
}
function afterResult(){
  const c=G.cur; if(c && c.kind==='persist' && c.g.needsReset){ c.g.needsReset=false; c.g.reset(); }
  G.cur=null;
  if(G.hearts<=0) return gameOver();
  if(G.pick===CFG.restAfter){ G.rest={strokes:[], cur:null, tab:'draw', doodle:ri(0,DOODLES.length-1), flip:0, seed:newSeed()}; setMode('rest'); return; }
  if(G.pick>=CFG.lapPicks){ G.stackOut=G.stack.map(s=>Object.assign({},s,{vx:rr(300,700),vy:rr(-200,100),vr:rr(-3,3)})); G.stack=[]; setMode('lapend'); return; }
  makeOffers(); setMode('pick');
}
function gameOver(){
  G.newBest = G.score>HI; if(G.newBest){ HI=G.score; try{ localStorage.setItem('lpp_hi', String(HI)); }catch(e){} }
  const n=makeNoteCanvas('#8FC9F5', 230, 96, newSeed()); againBtn={x:500,y:604,w:230,h:96,rot:(R()-0.5)*0.08,cv:n.cv,pad:n.pad};
  setMode('gameover');
}

/* ---------- update ---------- */
function update(dt){
  MT += dt;
  if(!G) return;
  G.shake=Math.max(0,G.shake-dt);
  for(const p of G.popups) p.t+=dt; G.popups=G.popups.filter(p=>p.t<1.6);
  if(G.discard){ G.discard.t+=dt; if(G.discard.t>0.5) G.discard=null; }
  for(const s of G.stackOut){ s.x=(s.x??868)+s.vx*dt; s.y=(s.y??596)+s.vy*dt; s.vy+=900*dt; s.rot+=s.vr*dt; }
  const restOpen = MODE==='rest';
  const bt = restOpen ? 212 : -592; G.book += (bt-G.book)*Math.min(1, dt*9);

  if(MODE==='pick'){ for(const n of G.offers){ n.enter=Math.min(1,n.enter+dt*3.2); const h=n.enter>=1 && noteHit(n,mouse.x,mouse.y); n.hover += ((h?1:0)-n.hover)*Math.min(1,dt*14); } }
  else if(MODE==='fly'){ G.fly.t+=dt/0.42; if(G.fly.t>=1){ const f=G.fly; G.stack.push({n:f.n, rot:f.r1, dx:f.x1-868, dy:f.y1-596}); G.fly=null; startGame(f.n); } }
  else if(MODE==='prompt'){ if(MT>0.8) setMode('play'); }
  else if(MODE==='play'){
    const g=G.cur.g; g.update(dt);
    if(g.extraTurn){ g.extraTurn=false; G.timer={dur:CFG.extraTurnTime, el:0}; }
    if(!g.done && !g.freeze()){ G.timer.el+=dt; if(G.timer.el>=G.timer.dur){ G.timer.el=G.timer.dur; const handled = g.onTimeout ? g.onTimeout() : false; if(!handled){ g.done=true; g.outcome='fail'; } } }
    if(g.done) finishGame();
  }
  else if(MODE==='result'){ if(MT>1.25) afterResult(); }
  else if(MODE==='rest'){ if(MT>CFG.restSeconds+0.4 || G.rest.end){ const r=G.rest; if(r.cur){ r.strokes.push(r.cur); r.cur=null; }
      if(r.strokes.reduce((s,st)=>s+st.length,0)>4) G.drawings.push(r.strokes);
      setMode('restout'); } }
  else if(MODE==='restout'){ if(MT>0.55){ makeOffers(); setMode('pick'); } }
  else if(MODE==='lapend'){ if(MT>2.0){ G.lap++; G.pick=0; G.stackOut=[]; buildShortDeck(); makeOffers(); setMode('pick'); } }
  else if(MODE==='gameover'){ G.goFlip+=dt; }
}

  ctx.fillStyle='rgba(0,0,0,0.15)'; ctx.beginPath(); ctx.moveTo(4,6); ctx.lineTo(-66,10); ctx.lineTo(-66,22); ctx.lineTo(10,14); ctx.fill();
  ctx.fillStyle='#f2c66b'; ctx.beginPath(); ctx.moveTo(-14,-7); ctx.lineTo(-60,-7); ctx.lineTo(-60,7); ctx.lineTo(-14,7); ctx.fill();
  ctx.fillStyle='#d9a77a'; ctx.beginPath(); ctx.moveTo(-14,-7); ctx.lineTo(0,0); ctx.lineTo(-14,7); ctx.fill();
  ctx.fillStyle='#333'; ctx.beginPath(); ctx.moveTo(-4,-2); ctx.lineTo(0,0); ctx.lineTo(-4,2); ctx.fill();
  ctx.fillStyle='#b9b9b9'; ctx.fillRect(-68,-7,8,14); ctx.fillStyle='#e8a3a3'; ctx.fillRect(-80,-7,12,14);
  ctx.restore();
  inkPath([[px-14,y-7],[px-60,y-7]].map(p=>[p[0],p[1]]), {w:1.2, seed:281, j:0.3, a:0.5});
  const left=Math.max(0,t.dur-t.el);
  htext(`${left.toFixed(1)}s`, x0-12, y+6, {size:22, c: left<2.5?RED:INK, align:'right', seed:282});
}
function drawPopups(){ for(const p of G.popups){ const a=1-clamp((p.t-0.9)/0.7,0,1); htext(p.text, p.x, p.y-p.t*34, {size:p.size, wt:700, c:p.c, align:'center', seed:p.seed, a}); } }

function renderTitle(){
  htext('Legal Pad', 500, 210, {size:96, font:'Gochi Hand', wt:400, c:INK, align:'center', seed:11, rot:-0.03});
  htext('Panic', 560, 300, {size:110, font:'Gochi Hand', wt:400, c:RED, align:'center', seed:12, rot:-0.05});
  inkPath([[380,318],[480,326],[600,320],[720,328]], {c:RED, w:3, seed:13, smooth:true});
  const lines=['pick one of two sticky notes every round',
    'short games are one quick shot, fail one and you lose a heart',
    'every short game you play dries your pen a little',
    'long games go one move at a time, win one for big points and fresh ink',
    'skip a long game too often and they move without you',
    'run out of ink and you lose a heart, lose all 4 and it is pencils down'];
  lines.forEach((l,k)=>htext(l, 170, 372+k*27, {size:22, c:GRAPHITE, seed:20+k}));
  if(HI>0) htext(`high score ${HI.toLocaleString()}`, 500, 540, {size:24, wt:700, c:'#2b3a8c', align:'center', seed:30});
  if(!titleBtn){ const n=makeNoteCanvas('#8FC9F5', 230, 96, newSeed()); titleBtn={x:500,y:610,w:230,h:96,rot:(R()-0.5)*0.08,cv:n.cv,pad:n.pad}; }
  const hov = btnHit(titleBtn, mouse.x, mouse.y);
  drawBtn(titleBtn, 'start', hov);
}
function btnHit(b,x,y){ return Math.abs(x-b.x)<b.w/2 && Math.abs(y-b.y)<b.h/2; }
function drawBtn(b, label, hov){
  ctx.save(); ctx.translate(b.x, b.y-(hov?5:0)); ctx.rotate(b.rot); const s=hov?1.04:1; ctx.scale(s,s);
  ctx.drawImage(b.cv, -b.w/2-b.pad, -b.h/2-b.pad, b.w+b.pad*2, b.h+b.pad*2);
  htext(label, 0, 14, {size:44, wt:700, c:'#0c3a63', align:'center', seed:strSeed(label)});
  ctx.restore();
}
function renderGameOver(){
  htext('pencils down', 500, 200, {size:84, font:'Gochi Hand', wt:400, c:RED, align:'center', seed:40, rot:-0.04});
  const rows=[`final score ${G.score.toLocaleString()}`, `best streak ${G.bestStreak}`, `laps reached ${G.lap}`,
    `long games won ${G.stats.won} · lost ${G.stats.lost} · drawn ${G.stats.drawn}`, `short games cleared ${G.stats.shortWon}`, `high score ${HI.toLocaleString()}`];
  rows.forEach((r,k)=>htext(r, 170, 280+k*36, {size: k===0?34:25, wt: k===0?700:600, c: k===0?INK:GRAPHITE, seed:50+k}));
  if(G.newBest){ ctx.save(); ctx.translate(250,520); ctx.rotate(-0.15); inkRect(-80,-36,160,52,{c:RED,w:3.5,seed:61,os:4}); htext('NEW BEST', 0, 2, {size:36, font:'Gochi Hand', wt:400, c:RED, align:'center', seed:62}); ctx.restore(); }
  // sketchbook of this run
  const bx=590, by=270, bw=330, bh=250;
  ctx.save(); ctx.shadowColor='rgba(0,0,0,0.35)'; ctx.shadowBlur=12; ctx.shadowOffsetX=5; ctx.shadowOffsetY=7; ctx.fillStyle='#54447f'; ctx.fillRect(bx-10,by-10,bw+20,bh+20); ctx.restore();
  ctx.fillStyle='#fffdf5'; ctx.fillRect(bx,by,bw,bh);
  if(G.drawings.length){
    const idx=Math.floor(G.goFlip/1.8)%G.drawings.length, st=G.drawings[idx];
    ctx.save(); ctx.translate(bx,by); ctx.scale(bw/580,bh/468); ctx.strokeStyle='#333'; ctx.lineWidth=3.2; ctx.lineCap='round'; ctx.lineJoin='round';
    for(const s of st){ if(s.length<2) continue; ctx.beginPath(); ctx.moveTo(s[0][0],s[0][1]); for(const p of s) ctx.lineTo(p[0],p[1]); ctx.stroke(); }
    ctx.restore();
    htext(`your doodles ${idx+1} of ${G.drawings.length}`, bx+bw/2, by+bh+40, {size:21, c:'#54447f', align:'center', seed:70});
  } else htext('no doodles this run', bx+bw/2, by+bh/2+8, {size:26, c:GRAPHITE, align:'center', seed:71});
  if(againBtn) drawBtn(againBtn, 'play again', btnHit(againBtn, mouse.x, mouse.y));
}

function render(){
  if(!G || MODE==='title'){ renderTitle(); return; }
  if(MODE==='gameover'){ drawThumbs(); drawBook(-592); renderGameOver(); return; }
  drawThumbs();
  drawStack();
  if(MODE==='pick'){
    htext('pick one!', 500, 222, {size:34, font:'Gochi Hand', wt:400, c:INK, align:'center', seed:290, rot:-0.03});
    for(const n of G.offers){ if(n.enter<=0) continue; const e=ease(n.enter), y=n.y-30*(1-e)-n.hover*7, s=(0.92+0.08*e)*(1+n.hover*0.03);
      ctx.save(); ctx.globalAlpha=e; drawNoteImg(n, n.x, y, n.rot, s); ctx.translate(n.x,y); ctx.rotate(n.rot); ctx.scale(s,s); drawNoteContent(n); ctx.restore(); }
  }
  if(G.discard){ const d=G.discard, t=d.t/0.5; ctx.save(); ctx.globalAlpha=1-t; drawNoteImg(d.n, d.n.x, d.n.y+t*60, d.n.rot+t*0.3, 1-t*0.1); ctx.restore(); }
  if(MODE==='fly'){ const f=G.fly, e=ease(f.t); const x=lerp(f.x0,f.x1,e), y=lerp(f.y0,f.y1,e)-Math.sin(e*Math.PI)*60, r=lerp(f.r0,f.r1,e), s=lerp(f.s0,0.42,e);
    drawNoteImg(f.n, x, y, r, s); ctx.save(); ctx.translate(x,y); ctx.rotate(r); ctx.scale(s,s); ctx.globalAlpha=1-e; drawNoteContent(f.n); ctx.restore(); }
  if(MODE==='prompt' || MODE==='play' || MODE==='result'){
    const g=G.cur.g, gm=G.cur.n.gm;
    ctx.save(); if(MODE==='prompt') ctx.globalAlpha=0.3; g.draw(); ctx.restore();
    if(MODE==='play'){ drawTimer(); htext(gm.hint, 500, 182, {size:21, c:GRAPHITE, align:'center', seed:strSeed(gm.hint), a:0.85}); if(G.cur.n.gold) { drawStar(160,182,12,77); htext('x2 points', 180, 189, {size:20, wt:700, c:'#7a5206', seed:78}); } }
    if(MODE==='prompt'){ const t=MT/0.8, s=lerp(1.4,1,easeBack(t*2.2));
      ctx.save(); ctx.translate(500,380); ctx.rotate(-0.06); ctx.scale(s,s);
      htext(gm.prompt, 0, 30, {size:110, font:'Gochi Hand', wt:400, c:shade(gm.color,-0.45), align:'center', seed:strSeed(gm.prompt)});
      ctx.restore(); }
    if(MODE==='result') drawStamp(G.result.stamp, G.result.col, G.result.sub, MT);
  }
  if(MODE==='lapend'){ const t=MT; ctx.save(); ctx.translate(500,360); ctx.rotate(-0.05); const s=lerp(1.5,1,easeBack(t*2));
    ctx.scale(s,s); htext(`lap ${G.lap} done`, 0, -10, {size:80, font:'Gochi Hand', wt:400, c:INK, align:'center', seed:300});
    htext('faster now...', 0, 60, {size:40, c:RED, align:'center', seed:301}); ctx.restore(); }
  drawBook(G.book);
  drawHUD();
  drawPopups();
}

/* ---------- input ---------- */
function toLogical(e){ const r=cv.getBoundingClientRect(); return [(e.clientX-r.left-OX)/SC, (e.clientY-r.top-OY)/SC]; }
cv.addEventListener('pointerdown', e=>{
  const [x,y]=toLogical(e); mouse.x=x; mouse.y=y; mouse.down=true; try{ cv.setPointerCapture(e.pointerId); }catch(_){}
  if(!G || MODE==='title'){ if(titleBtn && btnHit(titleBtn,x,y)) newRun(); return; }
  if(MODE==='gameover'){ if(againBtn && btnHit(againBtn,x,y)) newRun(); return; }
  if(MODE==='pick'){ for(const n of G.offers){ if(n.enter>=1 && noteHit(n,x,y)){ choose(n); return; } } return; }
  if(MODE==='play'){ G.cur.g.onDown(x,y); return; }
  if(MODE==='rest'){
    const r=G.rest, px=G.book+30, py=128;
    if(y>py-28 && y<py+4){ if(x>px+370&&x<px+460){ r.tab='draw'; return; } if(x>px+470&&x<px+560){ r.tab='doodles'; return; } }
    if(x>px+456 && x<px+566 && y>py+412 && y<py+458){ r.end=true; return; }
    if(x>px && x<px+580 && y>py && y<py+470){
      if(r.tab==='draw') r.cur=[[x-px,y-py]];
      else if(r.flip<=0){ r.flip=0.001; const step=()=>{ r.flip+=0.06; if(r.flip>=0.5 && !r.swapped){ r.swapped=true; r.doodle=(r.doodle+1)%DOODLES.length; } if(r.flip<1) requestAnimationFrame(step); else { r.flip=0; r.swapped=false; } }; requestAnimationFrame(step); }
    }
  }
});
cv.addEventListener('pointermove', e=>{
  const [x,y]=toLogical(e); mouse.x=x; mouse.y=y;
  let cur='default';
  if(!G || MODE==='title'){ if(titleBtn && btnHit(titleBtn,x,y)) cur='pointer'; }
  else if(MODE==='gameover'){ if(againBtn && btnHit(againBtn,x,y)) cur='pointer'; }
  else if(MODE==='pick'){ if(G.offers.some(n=>noteHit(n,x,y))) cur='pointer'; }
  else if(MODE==='play'){ const g=G.cur.g; g.onMove(x,y); cur=g.cursor(); }
  else if(MODE==='rest'){ const r=G.rest, px=G.book+30, py=128;
    if(r.cur && r.tab==='draw'){ r.cur.push([clamp(x-px,0,580), clamp(y-py,0,470)]); }
    cur = r.tab==='draw' ? 'crosshair' : 'pointer'; }
  cv.style.cursor=cur;
});
function up(){ mouse.down=false; if(G && MODE==='play') G.cur.g.onUp(); if(G && G.rest && G.rest.cur){ G.rest.strokes.push(G.rest.cur); G.rest.cur=null; } }
cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);

/* ---------- loop ---------- */
function resize(){
  DPR=Math.min(2, window.devicePixelRatio||1);
  cv.width=Math.max(1,Math.floor(innerWidth*DPR)); cv.height=Math.max(1,Math.floor(innerHeight*DPR));
  cv.style.width=innerWidth+'px'; cv.style.height=innerHeight+'px';
  SC=Math.min(innerWidth/W, innerHeight/H); OX=(innerWidth-W*SC)/2; OY=(innerHeight-H*SC)/2;
  buildDesk();
}
window.addEventListener('resize', resize);
let last=performance.now();
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now; T+=dt; BOIL=Math.floor(T*CFG.boilFps)%3;
  try {
    update(dt);
    ctx.setTransform(1,0,0,1,0,0);
    ctx.drawImage(deskCv,0,0,cv.width,cv.height);
    ctx.setTransform(DPR*SC,0,0,DPR*SC,DPR*OX,DPR*OY);
    if(G && G.shake>0){ const k=G.shake*14; ctx.translate(rr(-k,k), rr(-k,k)); }
    ctx.drawImage(paperCv,0,0,W,H);
    render();
  } catch(err){ console.error(err); }
  requestAnimationFrame(frame);
}
function boot(){ resize(); buildPaper(); requestAnimationFrame(frame); }
const fontsReady = document.fonts ? Promise.race([Promise.all([document.fonts.load('600 24px "Caveat"'), document.fonts.load('700 24px "Caveat"'), document.fonts.load('24px "Gochi Hand"')]), new Promise(r=>setTimeout(r,2500))]) : Promise.resolve();
fontsReady.then(boot, boot);
</script>
</body>
